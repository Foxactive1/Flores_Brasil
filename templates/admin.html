<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf3e8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <title>Painel Admin - Flores Brasil</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <style>
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 24px; }
    .stat-card {
      background: var(--paper); border-radius: var(--radius-md); padding: 24px; text-align: center;
      box-shadow: var(--shadow-sm); border: 1px solid var(--linha); transition: 0.2s;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .stat-card .icon { font-size: 2.4rem; margin-bottom: 10px; }
    .stat-card h3 { font-size: 0.95rem; color: var(--seco); font-family: var(--font-sans); font-weight: 600; }
    .stat-card p { font-size: 1.6rem; font-weight: 700; color: var(--ink); margin: 6px 0; }
    .stat-card a { display: inline-block; margin-top: 6px; color: var(--rosa-deep); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .stat-card a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="fb-container" style="padding-top: 24px; padding-bottom: 40px;">
    <header class="fb-row" style="border-bottom: 2px solid var(--linha); padding-bottom: 16px; margin-bottom: 8px;">
      <h1 style="border: none; padding: 0; font-size: 1.6rem;">🌸 Painel Administrativo</h1>
      <a href="{{ url_for('main.admin_logout') }}" class="btn btn--outline btn--sm">Sair</a>
    </header>

    <div class="card-grid">
      <div class="stat-card">
        <div class="icon" aria-hidden="true">📦</div>
        <h3>Pedidos</h3>
        <p>{{ pedidos_count or 0 }}</p>
        <a href="{{ url_for('main.admin_pedidos') }}">Ver todos →</a>
      </div>
      <div class="stat-card">
        <div class="icon" aria-hidden="true">🤖</div>
        <h3>Métricas da IA</h3>
        <p>📊</p>
        <a href="{{ url_for('main.admin_ia_metrics') }}">Ver dashboard →</a>
      </div>
      <div class="stat-card">
        <div class="icon" aria-hidden="true">📈</div>
        <h3>Estatísticas</h3>
        <p>📉</p>
        <span style="color: var(--seco-light); font-size: 0.85rem;">Em breve</span>
      </div>
    </div>

    <div style="margin-top: 40px; text-align: center;">
      <a href="/" class="btn btn--ghost btn--sm">← Voltar para a loja</a>
    </div>
  </div>
</body>
</html>
