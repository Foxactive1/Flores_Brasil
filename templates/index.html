<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flores Brasil — flores, chocolates, presentes e cartões com entrega em Franca e região. Peça em minutos, finalize pelo WhatsApp.">
  <meta name="theme-color" content="#faf3e8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <title>Flores Brasil — Flores e Presentes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <style>
    /* ---- Estilos específicos da vitrine (não fazem parte do design system) ---- */
    .hero { text-align: center; padding: 64px 24px 44px; background: linear-gradient(135deg, var(--creme) 0%, #ffe6dc 100%); }
    .hero h1 { font-size: clamp(2rem,5.5vw,3.6rem); font-weight: 500; }
    .hero p { margin-top: 12px; color: var(--seco); font-size: 1.05rem; }

    .tabs-wrapper { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 28px 24px 0; }
    .tab {
      background: none; border: 1.5px solid var(--petala); color: var(--seco);
      border-radius: var(--radius-pill); padding: 8px 22px; cursor: pointer; transition: all 0.2s; font-size: 0.92rem;
    }
    .tab.active, .tab:hover { background: var(--rosa); border-color: var(--rosa); color: #fff; }

    .cardapio-section { padding: 20px 24px 56px; max-width: 1200px; margin: 0 auto; }
    .cardapio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 26px; padding-top: 28px; }
    .cardapio-grid:focus { outline: none; }
    .item-card {
      background: var(--paper); border-radius: var(--radius-lg); padding: 24px 20px 20px;
      box-shadow: var(--shadow-sm); transition: all 0.25s; display: flex; flex-direction: column; gap: 10px;
      border: 1px solid var(--linha);
    }
    .item-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--petala); }
    .item-emoji { font-size: 2.6rem; }
    .item-name { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600; }
    .item-desc { font-size: 0.82rem; color: var(--seco); line-height: 1.45; flex: 1; }
    .item-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 10px; }
    .item-price { font-weight: 600; color: var(--musgo); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .item-tag { font-size: 0.65rem; background: var(--petala); color: var(--terra); padding: 2px 10px; border-radius: var(--radius-pill); }
    .btn-add { background: var(--rosa); color: #fff; border: none; border-radius: var(--radius-pill); padding: 7px 20px; cursor: pointer; transition: 0.2s; font-weight: 600; font-size: 0.9rem; }
    .btn-add:hover { background: var(--rosa-deep); }
    .btn-add:active { transform: scale(0.96); }

    #cart-fab {
      position: fixed; bottom: 26px; right: 26px; z-index: 200; background: var(--rosa); color: #fff; border: none;
      border-radius: 60px; width: 60px; height: 60px; font-size: 1.6rem; cursor: pointer; box-shadow: 0 6px 18px rgba(196,135,122,0.5);
      display: none; align-items: center; justify-content: center; transition: transform 0.2s;
    }
    #cart-fab.visible { display: flex; }
    #cart-fab:hover { transform: scale(1.07); }
    #cart-badge {
      position: absolute; top: -2px; right: -2px; background: var(--musgo); color: #fff; border-radius: 50%;
      width: 22px; height: 22px; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--bg);
    }
    #cart-overlay { display: none; position: fixed; inset: 0; background: rgba(36,24,17,0.4); z-index: 300; backdrop-filter: blur(3px); }
    #cart-overlay.open { display: block; }
    #cart-drawer {
      position: fixed; top: 0; right: -100%; width: min(440px,92vw); height: 100vh; background: var(--paper); z-index: 400;
      display: flex; flex-direction: column; transition: right 0.3s cubic-bezier(0.2,0.9,0.4,1.1);
      border-radius: 24px 0 0 24px; box-shadow: -8px 0 32px rgba(0,0,0,0.14);
    }
    #cart-drawer.open { right: 0; }
    .drawer-header { padding: 20px 24px; border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; }
    .drawer-header h2 { font-size: 1.4rem; border: none; padding: 0; margin: 0; }
    .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--seco); line-height: 1; padding: 6px; border-radius: 8px; }
    .btn-close:hover { color: var(--terra); }
    #cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .cart-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--linha-suave); }
    .ci-emoji { font-size: 2rem; }
    .ci-info { flex: 1; }
    .ci-name { font-weight: 600; }
    .ci-price { font-size: 0.8rem; color: var(--seco); margin-top: 4px; }
    .ci-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .ci-btn { background: var(--creme); border: 1px solid var(--petala); border-radius: var(--radius-pill); width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
    .ci-btn:hover { background: var(--petala); }
    .ci-remove { background: none; border: none; color: var(--seco-light); cursor: pointer; font-size: 1.2rem; padding: 4px; }
    .ci-remove:hover { color: var(--erro); }
    #drawer-footer { border-top: 1px solid var(--linha); padding: 20px 24px 30px; background: var(--paper); display: none; }
    .drawer-obs textarea { width: 100%; }
    .summary-row { display: flex; justify-content: space-between; margin: 14px 0 12px; font-weight: 500; }
    #summary-total { font-weight: 700; color: var(--musgo); }

    #entrega-overlay { display: none; position: fixed; inset: 0; background: rgba(36,24,17,0.45); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
    #entrega-overlay.open { display: flex; }
    #entrega-modal { background: var(--paper); border-radius: var(--radius-lg); padding: 28px; width: min(500px,100%); max-height: 90vh; overflow-y: auto; }
    #entrega-modal h3 { margin-bottom: 18px; }
  </style>
</head>
<body>

<a href="#conteudo" class="skip-link">Pular para o conteúdo</a>

<nav class="fb-navbar" id="navbar" aria-label="Navegação principal">
  <a href="/" class="fb-brand">🌸 Flores Brasil</a>
  <div class="nav-actions">
    <button class="btn btn--outline btn--sm" id="open-entrega-btn" aria-haspopup="dialog">📍 Entrega</button>
  </div>
</nav>

<main id="conteudo">
  <section class="hero reveal">
    <h1>Flores &amp; Presentes com Amor</h1>
    <p>Entregamos emoções — Franca e região</p>
  </section>

  <div class="tabs-wrapper reveal" role="tablist" aria-label="Categorias">
    <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-flores" data-tab="flores">🌷 Flores</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="tab-chocolates" data-tab="chocolates">🍫 Chocolates</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="tab-presentes" data-tab="presentes">🎁 Presentes</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="tab-cartoes" data-tab="cartoes">💌 Cartões</button>
  </div>

  <section class="cardapio-section" aria-live="polite">
    <div id="tab-flores" class="cardapio-grid" role="tabpanel"></div>
    <div id="tab-chocolates" class="cardapio-grid" role="tabpanel" style="display: none;"></div>
    <div id="tab-presentes" class="cardapio-grid" role="tabpanel" style="display: none;"></div>
    <div id="tab-cartoes" class="cardapio-grid" role="tabpanel" style="display: none;"></div>
  </section>
</main>

<button id="cart-fab" aria-label="Abrir carrinho de compras">🛒 <span id="cart-badge" aria-hidden="true">0</span></button>

<div id="cart-overlay"></div>
<div id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title">
  <div class="drawer-header">
    <h2 id="cart-title">🛒 Meu Pedido</h2>
    <button class="btn-close" id="close-drawer-btn" aria-label="Fechar carrinho">✕</button>
  </div>
  <div id="cart-items">
    <div id="cart-empty-state" class="fb-empty">
      <span class="fb-empty__emoji">🌸</span>
      <div class="fb-empty__title">Seu carrinho está vazio</div>
      Adicione flores e presentes para começar.
    </div>
    <div id="cart-items-list"></div>
  </div>
  <div id="drawer-footer">
    <div class="drawer-obs field">
      <label for="cart-obs" class="sr-only">Observação do pedido</label>
      <textarea id="cart-obs" rows="2" placeholder="✨ Alguma observação? Ex: trocar fita, horário especial..."></textarea>
    </div>
    <div class="summary-row">
      <span id="summary-qty">0 itens</span>
      <span id="summary-total">R$ 0,00</span>
    </div>
    <button class="btn btn--whatsapp" id="btn-finalizar">💬 Finalizar via WhatsApp</button>
  </div>
</div>

<div id="entrega-overlay" role="dialog" aria-modal="true" aria-labelledby="entrega-title">
  <div id="entrega-modal">
    <h3 id="entrega-title">📍 Endereço de Entrega</h3>
    <div class="field"><label for="e-logradouro">Logradouro *</label><input id="e-logradouro" placeholder="Rua, Avenida..."></div>
    <div class="field-row">
      <div class="field"><label for="e-numero">Número</label><input id="e-numero" placeholder="123"></div>
      <div class="field" style="flex:2"><label for="e-complemento">Complemento</label><input id="e-complemento" placeholder="Apto"></div>
    </div>
    <div class="field"><label for="e-bairro">Bairro *</label><input id="e-bairro" placeholder="Bairro"></div>
    <div class="field-row">
      <div class="field"><label for="e-cidade">Cidade</label><input id="e-cidade" value="Franca"></div>
      <div class="field" style="max-width:90px"><label for="e-estado">UF</label><input id="e-estado" value="SP" maxlength="2"></div>
      <div class="field"><label for="e-cep">CEP</label><input id="e-cep" placeholder="14400-000"></div>
    </div>
    <div class="field"><label for="e-referencia">Referência</label><input id="e-referencia" placeholder="Ponto de referência"></div>
    <button class="btn btn--primary btn--block" id="salvar-endereco">✅ Salvar Endereço</button>
    <button class="btn btn--ghost btn--block" id="cancelar-endereco" style="margin-top:12px;">Cancelar</button>
  </div>
</div>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script>
  // ---------- CONFIG ----------
  const API_BASE = '';
  let cart = {};
  let enderecoEntrega = null;
  let clienteInfo = null;

  // Elementos
  const cartBadge = document.getElementById('cart-badge');
  const cartFab = document.getElementById('cart-fab');
  const cartOverlay = document.getElementById('cart-overlay');
  const cartDrawer = document.getElementById('cart-drawer');
  const cartEmptyState = document.getElementById('cart-empty-state');
  const cartItemsList = document.getElementById('cart-items-list');
  const drawerFooter = document.getElementById('drawer-footer');
  const summaryQtySpan = document.getElementById('summary-qty');
  const summaryTotalSpan = document.getElementById('summary-total');

  const escapeHtml = FB.escapeHtml;
  const showToast = FB.showToast;

  // ---------- CARRINHO ----------
  function updateCartUI() {
    const totalQty = Object.values(cart).reduce((s, i) => s + i.qty, 0);
    cartBadge.innerText = totalQty;
    cartFab.classList.toggle('visible', totalQty > 0);
    cartFab.setAttribute('aria-label', totalQty > 0 ? `Abrir carrinho, ${totalQty} ${totalQty === 1 ? 'item' : 'itens'}` : 'Abrir carrinho de compras');
    renderCartItems();
  }

  function renderCartItems() {
    const keys = Object.keys(cart);
    if (keys.length === 0) {
      cartEmptyState.style.display = 'block';
      cartItemsList.innerHTML = '';
      drawerFooter.style.display = 'none';
      return;
    }
    cartEmptyState.style.display = 'none';
    let html = '';
    let totalVal = 0, totalItens = 0;
    for (let id of keys) {
      const item = cart[id];
      totalVal += item.price * item.qty;
      totalItens += item.qty;
      html += `<div class="cart-item">
        <span class="ci-emoji" aria-hidden="true">${escapeHtml(item.emoji)}</span>
        <div class="ci-info">
          <div class="ci-name">${escapeHtml(item.name)}</div>
          <div class="ci-price">R$ ${item.price.toFixed(2).replace('.',',')} × ${item.qty}</div>
          <div class="ci-controls">
            <button class="ci-btn decr-item" data-id="${item.id}" aria-label="Diminuir quantidade de ${escapeHtml(item.name)}">−</button>
            <span class="ci-qty" aria-live="polite">${item.qty}</span>
            <button class="ci-btn incr-item" data-id="${item.id}" aria-label="Aumentar quantidade de ${escapeHtml(item.name)}">+</button>
          </div>
        </div>
        <button class="ci-remove remove-item" data-id="${item.id}" aria-label="Remover ${escapeHtml(item.name)} do carrinho">✕</button>
      </div>`;
    }
    cartItemsList.innerHTML = html;
    summaryQtySpan.innerText = `${totalItens} ${totalItens === 1 ? 'item' : 'itens'}`;
    summaryTotalSpan.innerText = `R$ ${totalVal.toFixed(2).replace('.',',')}`;
    drawerFooter.style.display = 'block';

    // Eventos dinâmicos
    document.querySelectorAll('.decr-item').forEach(btn => {
      btn.removeEventListener('click', handleDecr);
      btn.addEventListener('click', handleDecr);
    });
    document.querySelectorAll('.incr-item').forEach(btn => {
      btn.removeEventListener('click', handleIncr);
      btn.addEventListener('click', handleIncr);
    });
    document.querySelectorAll('.remove-item').forEach(btn => {
      btn.removeEventListener('click', handleRemove);
      btn.addEventListener('click', handleRemove);
    });
  }

  function handleDecr(e) { const id = parseInt(e.currentTarget.dataset.id); changeQty(id, -1); }
  function handleIncr(e) { const id = parseInt(e.currentTarget.dataset.id); changeQty(id, 1); }
  function handleRemove(e) { const id = parseInt(e.currentTarget.dataset.id); removeItem(id); }

  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    updateCartUI();
    if (Object.keys(cart).length === 0) showToast("🛒 Carrinho vazio");
  }

  function removeItem(id) {
    if (cart[id]) delete cart[id];
    updateCartUI();
  }

  function addToCart(id, name, emoji, price) {
    const parsedPrice = parseFloat(price);
    if (cart[id]) cart[id].qty++;
    else cart[id] = { id, name, emoji, price: parsedPrice, qty: 1 };
    updateCartUI();
    showToast(`${emoji} ${name} adicionado!`);
  }

  // ---------- PRODUTOS ----------
  async function carregarProdutos() {
    try {
      const res = await fetch(`${API_BASE}/api/produtos`);
      if (!res.ok) throw new Error();
      const produtos = await res.json();
      const porCategoria = { Flores: [], Chocolates: [], Presentes: [], Cartões: [] };
      produtos.forEach(p => {
        const cat = p.categoria_nome;
        if (cat === 'Flores') porCategoria.Flores.push(p);
        else if (cat === 'Chocolates') porCategoria.Chocolates.push(p);
        else if (cat === 'Presentes') porCategoria.Presentes.push(p);
        else if (cat === 'Cartões') porCategoria.Cartões.push(p);
      });
      renderizarProdutos(porCategoria);
    } catch (e) {
      console.error(e);
      document.querySelectorAll('.cardapio-grid').forEach(g => {
        g.innerHTML = '<div class="fb-empty" style="grid-column:1/-1"><span class="fb-empty__emoji">❌</span><div class="fb-empty__title">Não foi possível carregar os produtos</div>Verifique sua conexão e recarregue a página.</div>';
      });
    }
  }

  function renderizarProdutos(porCategoria) {
    const mapping = { Flores: 'tab-flores', Chocolates: 'tab-chocolates', Presentes: 'tab-presentes', Cartões: 'tab-cartoes' };
    for (let [cat, gridId] of Object.entries(mapping)) {
      const grid = document.getElementById(gridId);
      if (!grid) continue;
      const lista = porCategoria[cat] || [];
      if (lista.length === 0) { grid.innerHTML = '<div class="fb-empty" style="grid-column:1/-1"><span class="fb-empty__emoji">✨</span><div class="fb-empty__title">Em breve</div>Novidades chegando nesta categoria.</div>'; continue; }
      let html = '';
      for (let prod of lista) {
        html += `<div class="item-card">
          <span class="item-emoji" aria-hidden="true">${prod.emoji || '🌸'}</span>
          <div class="item-name">${escapeHtml(prod.nome)}</div>
          <p class="item-desc">${escapeHtml(prod.descricao || '')}</p>
          <div class="item-footer">
            <span class="item-price">R$ ${Number(prod.preco).toFixed(2).replace('.',',')}${prod.tag ? `<span class="item-tag">${escapeHtml(prod.tag)}</span>` : ''}</span>
            <button class="btn-add" data-id="${prod.id}" data-name="${escapeHtml(prod.nome)}" data-emoji="${prod.emoji || '🌸'}" data-price="${prod.preco}">+ Pedir</button>
          </div>
        </div>`;
      }
      grid.innerHTML = html;
      grid.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', () => {
          addToCart(parseInt(btn.dataset.id), btn.dataset.name, btn.dataset.emoji, parseFloat(btn.dataset.price));
        });
      });
    }
  }

  // ---------- WHATSAPP (FALLBACK ROBUSTO) ----------
  async function sendWhatsApp() {
    const keys = Object.keys(cart);
    if (keys.length === 0) { showToast('Seu carrinho está vazio', { error: true }); return; }
    if (!enderecoEntrega) { showToast('Informe o endereço de entrega', { error: true }); openEntregaModal(); return; }

    let nome = clienteInfo?.nome || '';
    let telefone = clienteInfo?.telefone || '';
    let mensagemCartao = '';

    if (!nome || !telefone) {
      const dados = await FB.promptModal([
        { id: 'nome', label: 'Seu nome completo', placeholder: 'Nome e sobrenome', value: nome },
        { id: 'telefone', label: 'WhatsApp com DDD', placeholder: '(16) 90000-0000', value: telefone || '(16)' },
        { id: 'cartao', label: 'Mensagem para o cartão (opcional)', placeholder: 'Ex: Com carinho, ...' }
      ], { title: '💬 Quase lá!', description: 'Precisamos desses dados para confirmar seu pedido.', okLabel: 'Enviar pedido' });

      if (!dados) return;
      if (!dados.nome) { showToast('Informe seu nome completo', { error: true }); return; }
      if (!dados.telefone) { showToast('Informe seu WhatsApp', { error: true }); return; }
      nome = dados.nome; telefone = dados.telefone; mensagemCartao = dados.cartao || '';
    }
    clienteInfo = { nome: nome.trim(), telefone: telefone.trim() };

    const btn = document.getElementById('btn-finalizar');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⏳ Enviando...';

    const produtosPedido = keys.map(id => ({ produto_id: parseInt(id), quantidade: cart[id].qty }));
    const pedidoData = {
      cliente: { nome: nome.trim(), telefone: telefone.trim(), email: null },
      local_entrega: enderecoEntrega,
      produtos: produtosPedido,
      observacao: document.getElementById('cart-obs').value || null,
      mensagem_cartao: mensagemCartao || null
    };

    try {
      const response = await fetch(`${API_BASE}/api/pedido`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pedidoData)
      });
      const result = await response.json();
      if (result.success && result.whatsapp_message) {
        const numero = result.whatsapp_number || "5516993117529";
        const msg = encodeURIComponent(result.whatsapp_message);
        window.open(`https://wa.me/${numero}?text=${msg}`, '_blank');
        cart = {}; updateCartUI(); closeCart();
        showToast(`✅ Pedido #${result.pedido?.codigo || ''} enviado!`);
      } else {
        // FALLBACK: mensagem local completa
        const numeroWhatsApp = "5516993117529"; // Substitua pelo número real da loja
        let itensTexto = '';
        let subtotal = 0;
        for (let id of keys) {
          const item = cart[id];
          subtotal += item.price * item.qty;
          itensTexto += `\n🌿 *${item.name}* × ${item.qty} — R$ ${(item.price * item.qty).toFixed(2).replace('.',',')}`;
        }
        const freteGratis = subtotal >= 100;
        const end = enderecoEntrega;
        const enderecoStr = `${end.logradouro}, ${end.numero} - ${end.bairro}, ${end.cidade} - ${end.estado}, CEP: ${end.cep} ${end.referencia ? `(Ref: ${end.referencia})` : ''}`;
        const observacao = document.getElementById('cart-obs').value ? `\n📝 *Observação:* ${document.getElementById('cart-obs').value}` : '';
        const cartaoMsg = mensagemCartao ? `\n💌 *Mensagem no cartão:* "${mensagemCartao}"` : '';
        const mensagemFinal = `*FLORES BRASIL - NOVO PEDIDO* 🌸\n\n*Código:* #${Math.random().toString(36).substring(2,10).toUpperCase()}\n*Status:* Pendente\n\n*🛍️ ITENS DO PEDIDO:*${itensTexto}\n\n*💰 Resumo:*\nSubtotal: R$ ${subtotal.toFixed(2).replace('.',',')}\nEntrega: *${freteGratis ? 'GRÁTIS' : 'A calcular'}*\n*TOTAL: R$ ${subtotal.toFixed(2).replace('.',',')}*${cartaoMsg}${observacao}\n\n*📍 Endereço de entrega:*\n${enderecoStr}\n\n*👤 Cliente:* ${nome.trim()}\n*📞 Telefone:* ${telefone.trim()}`;
        const msgEncoded = encodeURIComponent(mensagemFinal);
        window.open(`https://wa.me/${numeroWhatsApp}?text=${msgEncoded}`, '_blank');
        cart = {}; updateCartUI(); closeCart();
        showToast(`✅ Pedido enviado!`);
      }
    } catch (err) {
      console.error(err);
      showToast('Erro de conexão. Tente novamente.', { error: true });
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }

  // ---------- ENDEREÇO ----------
  function openEntregaModal() {
    document.getElementById('entrega-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('e-logradouro').focus();
  }
  function closeEntregaModal() { document.getElementById('entrega-overlay').classList.remove('open'); document.body.style.overflow = ''; }
  function saveEndereco() {
    const logr = document.getElementById('e-logradouro').value.trim();
    const bairro = document.getElementById('e-bairro').value.trim();
    if (!logr || !bairro) { showToast('Preencha logradouro e bairro', { error: true }); return; }
    enderecoEntrega = {
      logradouro: logr,
      numero: document.getElementById('e-numero').value.trim() || 'S/N',
      complemento: document.getElementById('e-complemento').value.trim() || null,
      bairro: bairro,
      cidade: document.getElementById('e-cidade').value.trim() || 'Franca',
      estado: document.getElementById('e-estado').value.trim() || 'SP',
      cep: document.getElementById('e-cep').value.trim() || '',
      referencia: document.getElementById('e-referencia').value.trim() || null
    };
    closeEntregaModal();
    showToast('📍 Endereço salvo!');
  }

  // ---------- TABS, DRAWER ----------
  function setTab(btn, tabId) {
    document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    document.querySelectorAll('.cardapio-grid').forEach(g => g.style.display = 'none');
    document.getElementById(`tab-${tabId}`).style.display = 'grid';
  }
  function openCart() { cartDrawer.classList.add('open'); cartOverlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeCart() { cartDrawer.classList.remove('open'); cartOverlay.classList.remove('open'); document.body.style.overflow = ''; }

  // ---------- INIT ----------
  document.addEventListener('DOMContentLoaded', () => {
    carregarProdutos();
    updateCartUI();

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTab(t, t.dataset.tab)));
    cartFab.addEventListener('click', openCart);
    document.getElementById('close-drawer-btn').addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);
    document.getElementById('open-entrega-btn').addEventListener('click', openEntregaModal);
    document.getElementById('salvar-endereco').addEventListener('click', saveEndereco);
    document.getElementById('cancelar-endereco').addEventListener('click', closeEntregaModal);
    document.getElementById('btn-finalizar').addEventListener('click', sendWhatsApp);

    FB.initNavbarScroll('#navbar');
    FB.initReveal();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCart(); closeEntregaModal(); } });
  });
</script>
</body>
</html>
